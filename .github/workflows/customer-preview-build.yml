name: Customer Preview Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/customer/**"
      - "package.json"
      - "package-lock.json"
      - "google-services.json"
      - ".github/workflows/customer-preview-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/customer/**"
      - "package.json"
      - "package-lock.json"
      - "google-services.json"
      - ".github/workflows/customer-preview-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: customer-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Trigger customer EAS build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_DIRECTIONS_API_KEY: ${{ secrets.EXPO_PUBLIC_DIRECTIONS_API_KEY }}
      EXPO_PUBLIC_OLA_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_OLA_MAPS_API_KEY }}
      EXPO_PUBLIC_CASHFREE_APP_ID: ${{ secrets.EXPO_PUBLIC_CASHFREE_APP_ID }}
      CASHFREE_ENVIRONMENT: ${{ secrets.CASHFREE_ENVIRONMENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Missing required GitHub Actions secret: EXPO_TOKEN" >&2
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase config
        shell: bash
        run: |
          set -euo pipefail
          if [ -f google-services.json ]; then
            cp google-services.json apps/customer/google-services.json
            mkdir -p apps/customer/android/app
            cp google-services.json apps/customer/android/app/google-services.json
          else
            echo "Repository root google-services.json was not found." >&2
            echo "Add it to the repo root or place it under apps/customer before running this workflow." >&2
            exit 1
          fi

      - name: Resolve build parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "platform=${{ github.event.inputs.platform }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=preview" >> "$GITHUB_OUTPUT"
            echo "platform=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger EAS build
        working-directory: apps/customer
        shell: bash
        env:
          BUILD_PROFILE: ${{ steps.params.outputs.profile }}
          BUILD_PLATFORM: ${{ steps.params.outputs.platform }}
        run: |
          set -euo pipefail

          log_file="$RUNNER_TEMP/customer-eas-build.log"

          eas build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --no-wait | tee "$log_file"

          LOG_FILE="$log_file" node <<'NODE'
          const fs = require('fs');

          const logFile = process.env.LOG_FILE;
          const buildProfile = process.env.BUILD_PROFILE;
          const buildPlatform = process.env.BUILD_PLATFORM;
          const log = fs.readFileSync(logFile, 'utf8');
          const urls = [...new Set(
            [...log.matchAll(/https?:\/\/[^\s)]+/g)]
              .map((match) => match[0].replace(/[.,]$/, ''))
          )];

          const summary = [
            '## Customer EAS build queued',
            '',
            `- Profile: \`${buildProfile}\``,
            `- Platform: \`${buildPlatform}\``,
            '- App: `apps/customer`',
            ''
          ];

          if (urls.length > 0) {
            summary.push('Links:');
            for (const url of urls) {
              summary.push(`- ${url}`);
            }
          } else {
            summary.push('Check the workflow logs for the EAS build URL.');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE
