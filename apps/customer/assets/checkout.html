<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartR Payment</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #F5B800;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            padding: 20px;
            background: #fdeaea;
            border-radius: 8px;
            display: none;
        }
        .success {
            color: #27ae60;
            padding: 20px;
            background: #eafaf1;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 CartR Payment</h1>
        <p>Processing your payment...</p>
        <div class="loader" id="loader"></div>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
    </div>

    <script>
        // Get payment session from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const paymentSessionId = urlParams.get('session');
        const orderId = urlParams.get('order');
        const env = urlParams.get('env') || 'sandbox';
        const returnUrl = urlParams.get('return') || 'cartr://payment-callback';

        if (!paymentSessionId) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = 'Missing payment session. Please try again.';
        } else {
            // Initialize Cashfree
            const cashfree = Cashfree({ mode: env === 'production' ? 'production' : 'sandbox' });
            
            // Open checkout
            cashfree.checkout({
                paymentSessionId: paymentSessionId,
                redirectTarget: '_self'
            }).then(result => {
                document.getElementById('loader').style.display = 'none';
                if (result.error) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = result.error.message || 'Payment failed';
                } else if (result.redirect) {
                    // Payment completed, redirect back to app
                    window.location.href = returnUrl + '?order_id=' + orderId + '&status=success';
                } else if (result.paymentDetails) {
                    document.getElementById('success').style.display = 'block';
                    document.getElementById('success').textContent = 'Payment successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = returnUrl + '?order_id=' + orderId + '&status=success';
                    }, 2000);
                }
            }).catch(err => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = err.message || 'Payment failed. Please try again.';
            });
        }
    </script>
</body>
</html>
