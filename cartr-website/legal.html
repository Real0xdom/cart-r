<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cartr Legal Documents – Terms, Privacy Policy, Refund Policy" />
  <title>Legal – Cartr</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <meta name="theme-color" content="#1A3D2B" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet" />

  <!-- Supabase credentials — edit config.js to set your URL and anon key -->
  <script src="config.js"></script>
  <script>
    // Read from config.js
    const SUPABASE_URL     = (typeof SUPABASE_CONFIG !== 'undefined') ? SUPABASE_CONFIG.url     : '';
    const SUPABASE_ANON_KEY = (typeof SUPABASE_CONFIG !== 'undefined') ? SUPABASE_CONFIG.anonKey : '';
  </script>

  <style>
    :root {
      --white:     #FFFFFF;
      --off-white: #F9F7F4;
      --orange:    #E8682A;
      --orange-lt: #FDF0E8;
      --orange-md: #F4A46B;
      --green:     #1A3D2B;
      --green-md:  #2E5E42;
      --green-lt:  #E8F0EB;
      --ink:       #111A14;
      --muted:     #6B7A6F;
      --border:    #E0E8E2;
      --font-display: 'Nunito', sans-serif;
      --font-body:    'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--white);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(26,61,43,0.06);
    }
    .navbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .nav-logo img {
      height: 38px;
      width: auto;
      border-radius: 8px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green);
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--orange); }

    /* Layout */
    .page-wrap {
      display: grid;
      grid-template-columns: 240px 1fr;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      gap: 56px;
      align-items: start;
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 80px;
    }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar-link {
      display: block;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--green);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .sidebar-link:hover {
      background: var(--orange-lt);
      border-color: rgba(232,104,42,0.2);
      color: var(--orange);
    }
    .sidebar-link.active {
      background: var(--green);
      color: var(--white);
    }

    /* Content */
    .legal-content-area { min-height: 400px; }

    /* Loading state */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: var(--font-display); font-size: 0.9rem; color: var(--muted); }

    /* Error state */
    .error-state {
      padding: 40px 32px;
      background: #FFF5F5;
      border: 1px solid #FECACA;
      border-radius: 16px;
      text-align: center;
    }
    .error-state h3 { font-family: var(--font-display); color: #C0392B; margin-bottom: 8px; }
    .error-state p { font-size: 0.9rem; color: var(--muted); }

    /* Document */
    .doc-header {
      padding-bottom: 28px;
      margin-bottom: 36px;
      border-bottom: 2px solid var(--border);
    }
    .doc-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--green-lt);
      color: var(--green);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .doc-version {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .doc-date {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .doc-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .doc-audience-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--orange-lt);
      color: var(--orange);
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-top: 12px;
    }

    /* Markdown-style content */
    .doc-body { line-height: 1.8; }
    .doc-body h1, .doc-body h2 {
      font-family: var(--font-display);
      color: var(--green);
      margin: 36px 0 14px;
      letter-spacing: -0.01em;
    }
    .doc-body h1 { font-size: 1.4rem; font-weight: 700; }
    .doc-body h2 { font-size: 1.15rem; font-weight: 700; }
    .doc-body h3 {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      margin: 24px 0 10px;
    }
    .doc-body p { margin-bottom: 16px; color: #374151; font-size: 0.95rem; }
    .doc-body ul, .doc-body ol {
      margin: 0 0 16px 24px;
      color: #374151;
      font-size: 0.95rem;
    }
    .doc-body li { margin-bottom: 8px; line-height: 1.7; }
    .doc-body strong { color: var(--green); font-weight: 600; }
    .doc-body a { color: var(--orange); text-decoration: underline; }
    .doc-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    .doc-body blockquote {
      border-left: 3px solid var(--orange);
      padding: 12px 20px;
      background: var(--orange-lt);
      border-radius: 0 8px 8px 0;
      margin: 20px 0;
    }
    .doc-body blockquote p { margin: 0; color: var(--green); font-style: italic; }

    /* Mobile sidebar toggle */
    .sidebar-toggle {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--green-lt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      margin-bottom: 24px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--green);
      width: 100%;
    }
    .sidebar-drawer {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Footer */
    .page-footer {
      background: var(--green);
      padding: 32px 0;
      text-align: center;
    }
    .page-footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-footer .footer-logo img {
      height: 32px;
      width: auto;
      border-radius: 6px;
    }
    .page-footer p { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

    /* Responsive */
    @media (max-width: 760px) {
      .page-wrap { grid-template-columns: 1fr; padding: 24px 16px 60px; gap: 24px; }
      .sidebar { position: static; }
      .sidebar-toggle { display: flex; }
      .sidebar-drawer.collapsed { display: none; }
      .doc-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html"><img src="assets/logo.png" alt="Cart-R Logistics" style="height:38px;border-radius:8px;" /></a>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main>
    <div class="page-wrap">
      <!-- Sidebar -->
      <aside class="sidebar">
        <p class="sidebar-title">Legal Documents</p>

        <!-- Mobile toggle -->
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
          <span id="sidebarToggleLabel">Select Document</span>
          <svg id="sidebarToggleIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div class="sidebar-nav sidebar-drawer" id="sidebarDrawer">
          <a class="sidebar-link" data-type="privacy_policy" onclick="loadDoc('privacy_policy', this)">Privacy Policy</a>
          <a class="sidebar-link" data-type="terms_conditions" onclick="loadDoc('terms_conditions', this)">Terms &amp; Conditions</a>
          <a class="sidebar-link" data-type="customer_terms" onclick="loadDoc('customer_terms', this)">Customer T&amp;C</a>
          <a class="sidebar-link" data-type="refund_policy" onclick="loadDoc('refund_policy', this)">Refund &amp; Cancellation</a>
        </div>
      </aside>

      <!-- Content -->
      <section class="legal-content-area" id="legalContent">
        <!-- Loaded dynamically -->
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    <div class="page-footer-inner">
      <a href="index.html" class="footer-logo"><img src="assets/logo.png" alt="Cart-R Logistics" /></a>
      <p>© 2026 Cartr Logistics · Pune, Maharashtra, India</p>
      <p>cartrlogistics@gmail.com</p>
    </div>
  </footer>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // Cartr Legal Page — uses Supabase REST API directly.
    // No SDK. No API key. The legal_documents table is publicly readable.
    // Only thing needed: your Supabase project URL set at the top of the file.
    // ═══════════════════════════════════════════════════════════════════

    // ── UI helpers ─────────────────────────────────────────────────
    function setLoading() {
      document.getElementById('legalContent').innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p class="loading-text">Loading document…</p>
        </div>`;
    }

    function setError(msg) {
      document.getElementById('legalContent').innerHTML = `
        <div class="error-state">
          <h3>Could not load document</h3>
          <p>${msg || 'Please check your connection and try again.'}</p>
        </div>`;
    }

    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // ── Simple markdown → HTML renderer ───────────────────────────
    function renderContent(raw) {
      if (!raw) return '';
      let html = raw
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
        .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^---$/gm, '<hr/>')
        .replace(/^&gt; (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
        .replace(/((?:^[\*\-] .+\n?)+)/gm, m => {
          const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[\*\-] /, '')}</li>`).join('');
          return `<ul>${items}</ul>`;
        })
        .replace(/((?:^\d+\. .+\n?)+)/gm, m => {
          const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
          return `<ol>${items}</ol>`;
        })
        .replace(/^(?!<[huo\d]|<hr|<block)(.+)$/gm, '<p>$1</p>')
        .replace(/<p><\/p>/g, '');
      return html;
    }

    function renderDoc(doc) {
      const audienceMap = { both: 'Customers & Drivers', customer: 'Customers', driver: 'Drivers' };
      const audience = audienceMap[doc.target_audience] || doc.target_audience;
      document.getElementById('legalContent').innerHTML = `
        <article>
          <div class="doc-header">
            <div class="doc-meta">
              <span class="doc-badge">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Legal
              </span>
              <span class="doc-version">Version ${doc.version || 'v1.0'}</span>
              ${doc.published_at ? `<span class="doc-date">Published ${formatDate(doc.published_at)}</span>` : ''}
            </div>
            <h1 class="doc-title">${doc.title}</h1>
            <div class="doc-audience-pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              Applies to: ${audience}
            </div>
          </div>
          <div class="doc-body">${renderContent(doc.content)}</div>
        </article>`;
    }

    // ── Load document via plain REST fetch ─────────────────────────
    async function loadDoc(type, clickedEl) {
      // Sidebar active state
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      if (clickedEl) clickedEl.classList.add('active');

      // Sync URL param
      const url = new URL(window.location.href);
      url.searchParams.set('type', type);
      history.replaceState(null, '', url.toString());

      // Update mobile toggle label and collapse drawer
      if (clickedEl) {
        document.getElementById('sidebarToggleLabel').textContent = clickedEl.textContent.trim();
        if (window.innerWidth < 760) {
          document.getElementById('sidebarDrawer').classList.add('collapsed');
        }
      }

      if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_PROJECT_URL' ||
          !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
        setError('Supabase credentials not set. Open <strong>config.js</strong> and replace the placeholder URL and anon key with your actual Supabase project values.');
        return;
      }

      setLoading();

      try {
        // Plain fetch — must include apikey header even for public tables
        const endpoint =
          `${SUPABASE_URL}/rest/v1/legal_documents` +
          `?type=eq.${encodeURIComponent(type)}` +
          `&is_published=eq.true` +
          `&order=published_at.desc` +
          `&limit=1`;

        const res = await fetch(endpoint, {
          headers: {
            'Accept':       'application/json',
            'apikey':       SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (res.status === 401) {
          setError(`
            <strong>Access denied (401)</strong> — Row Level Security is blocking the request.<br><br>
            Run this once in your
            <a href="https://supabase.com/dashboard" target="_blank" style="color:var(--orange);text-decoration:underline">Supabase SQL Editor</a>:<br><br>
            <code style="display:block;background:#f4f4f4;padding:14px 16px;border-radius:8px;font-size:0.82rem;margin-top:8px;text-align:left;line-height:1.8;color:#1A3D2B;white-space:pre">CREATE POLICY "Public read published docs"
ON public.legal_documents
FOR SELECT TO anon
USING (is_published = true);</code>
          `);
          return;
        }

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const rows = await res.json();

        if (!rows || rows.length === 0) {
          setError('This document has not been published yet. Set <strong>is_published = true</strong> in Supabase for this document type.');
          return;
        }

        renderDoc(rows[0]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        setError('Could not load the document. Please try again later.');
        console.error(e);
      }
    }

    // ── Mobile sidebar toggle ──────────────────────────────────────
    function toggleSidebar() {
      const drawer = document.getElementById('sidebarDrawer');
      const icon   = document.getElementById('sidebarToggleIcon');
      drawer.classList.toggle('collapsed');
      icon.style.transform = drawer.classList.contains('collapsed') ? '' : 'rotate(180deg)';
    }

    // ── Init: read ?type= from URL and load ────────────────────────
    (function init() {
      const type = new URLSearchParams(window.location.search).get('type') || 'privacy_policy';
      const link = document.querySelector(`.sidebar-link[data-type="${type}"]`);
      loadDoc(type, link);
    })();
  </script>
</body>
</html>
